kind = "video"
previewPath = "/journey-video/"
title = "Mission Distinction – Journey Video"
version = "1.0.0"
id = "artifacts/journey-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/journey-video/" ]
localPort = 21493

[services.development]
run = "pnpm --filter @workspace/journey-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/journey-video", "run", "build" ]
publicDir = "artifacts/journey-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21493"
BASE_PATH = "/journey-video/"
