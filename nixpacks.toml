# Railway / Nixpacks build config for the Mission Distinction monorepo.
# Only the API server is built and run here.
# Frontend (mission-distinction) and video (scene1-film) are static sites
# deployed separately on Vercel.

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "npm install -g pnpm@9",
  "pnpm install --frozen-lockfile"
]

[phases.build]
cmds = [
  "pnpm --filter @workspace/api-server run build"
]

[start]
cmd = "node --enable-source-maps artifacts/api-server/dist/index.mjs"
